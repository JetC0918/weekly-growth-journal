name = "weekly-growth-journal-api"
main = "src/worker.py"
compatibility_date = "2026-10-26"
compatibility_flags = ["python_workers"]

[[hyperdrive]]
binding = "HYPERDRIVE"
# The deploy workflow substitutes the real resource id into a temporary config.
id = "00000000-0000-4000-8000-000000000000"

[vars]
APP_ENV = "production"
DJANGO_DEBUG = "false"
AI_PROVIDER_MODE = "openai"
AI_API_KEY = ""
