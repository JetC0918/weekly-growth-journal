[project]
name = "weekly-growth-journal-cloudflare-worker"
version = "0.1.0"
description = "Isolated Cloudflare Python Worker deployment for the Django API"
requires-python = ">=3.13"
dependencies = [
  "Django>=5.2,<6.0",
  "django-cors-headers>=4.7,<5.0",
  "djangorestframework>=3.16,<4.0",
  "psycopg>=3.2,<4.0",
]

[dependency-groups]
dev = [
  "workers-py",
  "workers-runtime-sdk",
]
