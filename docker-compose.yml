services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weekly_growth_journal}
      POSTGRES_USER: ${POSTGRES_USER:-weekly_growth_journal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weekly-growth-local}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: weekly_growth_journal_postgres_data
