name: Deploy to Cloudflare

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    # Keep this repository variable unset until the release gates in _docs/cicd.md
    # are completed, including confirmation that Hyperdrive requires TLS to its origin.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - name: Check out the commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Check deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID }}
          CLOUDFLARE_API_ORIGIN: ${{ vars.CLOUDFLARE_API_ORIGIN }}
          CLOUDFLARE_FRONTEND_ORIGIN: ${{ vars.CLOUDFLARE_FRONTEND_ORIGIN }}
          CF_DJANGO_SECRET_KEY: ${{ secrets.CF_DJANGO_SECRET_KEY }}
          CF_TOKEN_SIGNING_KEY: ${{ secrets.CF_TOKEN_SIGNING_KEY }}
          CF_DJANGO_ALLOWED_HOSTS: ${{ secrets.CF_DJANGO_ALLOWED_HOSTS }}
          CF_CORS_ALLOWED_ORIGINS: ${{ secrets.CF_CORS_ALLOWED_ORIGINS }}
        run: |
          python - <<'PY'
          import os
          import sys
          from urllib.parse import urlparse

          required = (
              "CLOUDFLARE_API_TOKEN",
              "CLOUDFLARE_ACCOUNT_ID",
              "CLOUDFLARE_HYPERDRIVE_ID",
              "CLOUDFLARE_API_ORIGIN",
              "CLOUDFLARE_FRONTEND_ORIGIN",
              "CF_DJANGO_SECRET_KEY",
              "CF_TOKEN_SIGNING_KEY",
              "CF_DJANGO_ALLOWED_HOSTS",
              "CF_CORS_ALLOWED_ORIGINS",
          )
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              print("Missing Cloudflare deployment configuration: " + ", ".join(missing), file=sys.stderr)
              raise SystemExit(1)
          for name in ("CLOUDFLARE_API_ORIGIN", "CLOUDFLARE_FRONTEND_ORIGIN"):
              parsed = urlparse(os.environ[name])
              if parsed.scheme != "https" or not parsed.netloc or parsed.path:
                  print(f"{name} must be an HTTPS origin without a path.", file=sys.stderr)
                  raise SystemExit(1)
          if os.environ["CF_DJANGO_SECRET_KEY"] == os.environ["CF_TOKEN_SIGNING_KEY"]:
              print("Django and token signing keys must be distinct.", file=sys.stderr)
              raise SystemExit(1)
          hosts = [host.strip() for host in os.environ["CF_DJANGO_ALLOWED_HOSTS"].split(",") if host.strip()]
          if not hosts or "*" in hosts or any("/" in host or "://" in host for host in hosts):
              print("CF_DJANGO_ALLOWED_HOSTS must be an explicit hostname allowlist without wildcards or URLs.", file=sys.stderr)
              raise SystemExit(1)
          cors_origins = [origin.strip() for origin in os.environ["CF_CORS_ALLOWED_ORIGINS"].split(",") if origin.strip()]
          if not cors_origins or any(urlparse(origin).scheme != "https" or not urlparse(origin).netloc or urlparse(origin).path for origin in cors_origins):
              print("CF_CORS_ALLOWED_ORIGINS must contain exact HTTPS origins without paths.", file=sys.stderr)
              raise SystemExit(1)
          if len(cors_origins) != 1 or cors_origins[0].rstrip("/") != os.environ["CLOUDFLARE_FRONTEND_ORIGIN"].rstrip("/"):
              print("CF_CORS_ALLOWED_ORIGINS must exactly match CLOUDFLARE_FRONTEND_ORIGIN.", file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build Cloudflare frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.CLOUDFLARE_API_ORIGIN }}/api
        run: bun run build

      - name: Install isolated Python Worker dependencies
        run: uv sync --locked --project backend/cloudflare

      - name: Package the canonical Django application
        run: uv run --locked --project backend/cloudflare python backend/cloudflare/scripts/package_backend.py

      - name: Render temporary Hyperdrive configuration
        env:
          CLOUDFLARE_HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          source = Path("backend/cloudflare/wrangler.toml")
          destination = Path("backend/cloudflare/wrangler.ci.toml")
          text = source.read_text(encoding="utf-8")
          placeholder = 'id = "00000000-0000-4000-8000-000000000000"'
          replacement = f'id = "{os.environ["CLOUDFLARE_HYPERDRIVE_ID"]}"'
          if placeholder not in text:
              raise SystemExit("Hyperdrive placeholder was not found in the Worker config.")
          destination.write_text(text.replace(placeholder, replacement), encoding="utf-8")
          PY

      - name: Deploy Django API Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run --locked --project backend/cloudflare pywrangler deploy --config backend/cloudflare/wrangler.ci.toml

      - name: Set production Django signing secrets
        env:
          CF_DJANGO_SECRET_KEY: ${{ secrets.CF_DJANGO_SECRET_KEY }}
          CF_TOKEN_SIGNING_KEY: ${{ secrets.CF_TOKEN_SIGNING_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "$CF_DJANGO_SECRET_KEY" | uv run --locked --project backend/cloudflare pywrangler secret put DJANGO_SECRET_KEY --config backend/cloudflare/wrangler.ci.toml
          printf '%s' "$CF_TOKEN_SIGNING_KEY" | uv run --locked --project backend/cloudflare pywrangler secret put TOKEN_SIGNING_KEY --config backend/cloudflare/wrangler.ci.toml

      - name: Set API host and CORS allowlists
        env:
          CF_DJANGO_ALLOWED_HOSTS: ${{ secrets.CF_DJANGO_ALLOWED_HOSTS }}
          CF_CORS_ALLOWED_ORIGINS: ${{ secrets.CF_CORS_ALLOWED_ORIGINS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "$CF_DJANGO_ALLOWED_HOSTS" | uv run --locked --project backend/cloudflare pywrangler secret put DJANGO_ALLOWED_HOSTS --config backend/cloudflare/wrangler.ci.toml
          printf '%s' "$CF_CORS_ALLOWED_ORIGINS" | uv run --locked --project backend/cloudflare pywrangler secret put CORS_ALLOWED_ORIGINS --config backend/cloudflare/wrangler.ci.toml

      - name: Deploy frontend Worker
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx --yes wrangler@4.129.0 deploy --config wrangler.jsonc

      - name: Smoke check deployed API and frontend
        env:
          CLOUDFLARE_API_ORIGIN: ${{ vars.CLOUDFLARE_API_ORIGIN }}
          CLOUDFLARE_FRONTEND_ORIGIN: ${{ vars.CLOUDFLARE_FRONTEND_ORIGIN }}
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-connrefused "$CLOUDFLARE_API_ORIGIN/api/health/"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-connrefused "$CLOUDFLARE_FRONTEND_ORIGIN/" --output /dev/null
