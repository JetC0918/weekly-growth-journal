name: Deploy to Cloudflare staging

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Deploy the current main revision to the staging Workers
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_deploy
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    steps:
      - name: Check out the selected main revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Check staging configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID }}
          CLOUDFLARE_API_ORIGIN: ${{ vars.CLOUDFLARE_API_ORIGIN }}
          CLOUDFLARE_FRONTEND_ORIGIN: ${{ vars.CLOUDFLARE_FRONTEND_ORIGIN }}
          CF_DJANGO_SECRET_KEY: ${{ secrets.CF_DJANGO_SECRET_KEY }}
          CF_TOKEN_SIGNING_KEY: ${{ secrets.CF_TOKEN_SIGNING_KEY }}
          CF_DJANGO_ALLOWED_HOSTS: ${{ secrets.CF_DJANGO_ALLOWED_HOSTS }}
          CF_CORS_ALLOWED_ORIGINS: ${{ secrets.CF_CORS_ALLOWED_ORIGINS }}
        run: |
          python - <<'PY'
          import os
          import sys
          from urllib.parse import urlparse

          def is_exact_https_origin(value):
              parsed = urlparse(value)
              try:
                  return (
                      parsed.scheme == "https"
                      and bool(parsed.hostname)
                      and parsed.port != 0
                      and parsed.username is None
                      and parsed.password is None
                      and not parsed.path
                      and not parsed.params
                      and not parsed.query
                      and not parsed.fragment
                  )
              except ValueError:
                  return False

          required = (
              "CLOUDFLARE_API_TOKEN",
              "CLOUDFLARE_ACCOUNT_ID",
              "CLOUDFLARE_HYPERDRIVE_ID",
              "CLOUDFLARE_API_ORIGIN",
              "CLOUDFLARE_FRONTEND_ORIGIN",
              "CF_DJANGO_SECRET_KEY",
              "CF_TOKEN_SIGNING_KEY",
              "CF_DJANGO_ALLOWED_HOSTS",
              "CF_CORS_ALLOWED_ORIGINS",
          )
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              print("Missing staging deployment configuration: " + ", ".join(missing), file=sys.stderr)
              raise SystemExit(1)
          for name in ("CLOUDFLARE_API_ORIGIN", "CLOUDFLARE_FRONTEND_ORIGIN"):
              if not is_exact_https_origin(os.environ[name]):
                  print(f"{name} must be an HTTPS origin without a path.", file=sys.stderr)
                  raise SystemExit(1)
          if os.environ["CF_DJANGO_SECRET_KEY"] == os.environ["CF_TOKEN_SIGNING_KEY"]:
              print("Django and token signing keys must be distinct.", file=sys.stderr)
              raise SystemExit(1)
          hosts = [host.strip() for host in os.environ["CF_DJANGO_ALLOWED_HOSTS"].split(",") if host.strip()]
          api_host = urlparse(os.environ["CLOUDFLARE_API_ORIGIN"]).hostname
          if not hosts or "*" in hosts or any("/" in host or "://" in host for host in hosts):
              print("CF_DJANGO_ALLOWED_HOSTS must be an explicit hostname allowlist without wildcards or URLs.", file=sys.stderr)
              raise SystemExit(1)
          if api_host not in hosts:
              print("CF_DJANGO_ALLOWED_HOSTS must include the staging API hostname.", file=sys.stderr)
              raise SystemExit(1)
          cors_origins = [origin.strip() for origin in os.environ["CF_CORS_ALLOWED_ORIGINS"].split(",") if origin.strip()]
          if not cors_origins or any(not is_exact_https_origin(origin) for origin in cors_origins):
              print("CF_CORS_ALLOWED_ORIGINS must contain exact HTTPS origins without paths.", file=sys.stderr)
              raise SystemExit(1)
          if len(cors_origins) != 1 or cors_origins[0] != os.environ["CLOUDFLARE_FRONTEND_ORIGIN"]:
              print("CF_CORS_ALLOWED_ORIGINS must exactly match CLOUDFLARE_FRONTEND_ORIGIN.", file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build staging frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.CLOUDFLARE_API_ORIGIN }}/api
        run: bun run build

      - name: Install isolated Python Worker dependencies
        run: uv sync --locked --project backend/cloudflare

      - name: Package the canonical Django application
        run: uv run --locked --project backend/cloudflare python backend/cloudflare/scripts/package_backend.py

      - name: Render staging Worker configurations
        env:
          CLOUDFLARE_HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          api_source = Path("backend/cloudflare/wrangler.toml")
          api_destination = Path("backend/cloudflare/wrangler.staging.ci.toml")
          api_text = api_source.read_text(encoding="utf-8")
          placeholder = 'id = "00000000-0000-4000-8000-000000000000"'
          if placeholder not in api_text:
              raise SystemExit("Hyperdrive placeholder was not found in the API Worker config.")
          api_text = api_text.replace(placeholder, f'id = "{os.environ["CLOUDFLARE_HYPERDRIVE_ID"]}"')
          api_text = api_text.replace('name = "weekly-growth-journal-api"', 'name = "weekly-growth-journal-api-staging"', 1)
          api_text += """

          [observability]
          enabled = true
          head_sampling_rate = 1

          [observability.logs]
          enabled = true
          head_sampling_rate = 1
          invocation_logs = true
          persist = true

          [observability.traces]
          enabled = true
          head_sampling_rate = 1
          persist = true

          [observability.issues]
          enabled = true
          """
          api_destination.write_text(api_text, encoding="utf-8")

          frontend_source = Path("frontend/wrangler.jsonc")
          frontend_destination = Path("frontend/wrangler.staging.jsonc")
          frontend_text = frontend_source.read_text(encoding="utf-8")
          production_name = '"name": "weekly-growth-journal-frontend"'
          if production_name not in frontend_text:
              raise SystemExit("Frontend Worker name was not found in its config.")
          frontend_text = frontend_text.replace(
              production_name,
              '"name": "weekly-growth-journal-frontend-staging"',
              1,
          )
          frontend_destination.write_text(frontend_text, encoding="utf-8")
          PY

      - name: Deploy staging Django API Worker
        working-directory: backend/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run --locked --project . pywrangler deploy --config wrangler.staging.ci.toml

      - name: Set staging Django signing secrets
        working-directory: backend/cloudflare
        env:
          CF_DJANGO_SECRET_KEY: ${{ secrets.CF_DJANGO_SECRET_KEY }}
          CF_TOKEN_SIGNING_KEY: ${{ secrets.CF_TOKEN_SIGNING_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "$CF_DJANGO_SECRET_KEY" | uv run --locked --project . pywrangler secret put DJANGO_SECRET_KEY --config wrangler.staging.ci.toml
          printf '%s' "$CF_TOKEN_SIGNING_KEY" | uv run --locked --project . pywrangler secret put TOKEN_SIGNING_KEY --config wrangler.staging.ci.toml

      - name: Set staging host and CORS allowlists
        working-directory: backend/cloudflare
        env:
          CF_DJANGO_ALLOWED_HOSTS: ${{ secrets.CF_DJANGO_ALLOWED_HOSTS }}
          CF_CORS_ALLOWED_ORIGINS: ${{ secrets.CF_CORS_ALLOWED_ORIGINS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "$CF_DJANGO_ALLOWED_HOSTS" | uv run --locked --project . pywrangler secret put DJANGO_ALLOWED_HOSTS --config wrangler.staging.ci.toml
          printf '%s' "$CF_CORS_ALLOWED_ORIGINS" | uv run --locked --project . pywrangler secret put CORS_ALLOWED_ORIGINS --config wrangler.staging.ci.toml

      - name: Deploy staging frontend Worker
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx --yes wrangler@4.129.0 deploy --config wrangler.staging.jsonc

      - name: Smoke check staging API and frontend
        env:
          CLOUDFLARE_API_ORIGIN: ${{ vars.CLOUDFLARE_API_ORIGIN }}
          CLOUDFLARE_FRONTEND_ORIGIN: ${{ vars.CLOUDFLARE_FRONTEND_ORIGIN }}
        run: |
          health_body="$(curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-connrefused "$CLOUDFLARE_API_ORIGIN/api/health/")"
          if ! printf '%s' "$health_body" | python -c 'import json, sys; raise SystemExit(0 if json.load(sys.stdin) == {"status": "ok"} else 1)'; then
            echo "Staging API health endpoint did not return the expected JSON contract." >&2
            exit 1
          fi

          protected_status="$(curl --silent --show-error --retry 8 --retry-delay 5 --retry-connrefused \
            --output /dev/null --write-out '%{http_code}' "$CLOUDFLARE_API_ORIGIN/api/reviews")"
          if [ "$protected_status" != "401" ]; then
            echo "Unauthenticated staging journal API request must return HTTP 401 (received $protected_status)." >&2
            exit 1
          fi

          frontend_html="$(curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-connrefused "$CLOUDFLARE_FRONTEND_ORIGIN/")"
          if ! printf '%s' "$frontend_html" | grep -Eq '<div id="root"' || \
             ! printf '%s' "$frontend_html" | grep -Eq '<script[^>]+src="[^"]+\.js' || \
             ! printf '%s' "$frontend_html" | grep -q 'Weekly'; then
            echo "Staging frontend response does not look like the built journal application." >&2
            exit 1
          fi
