name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django-unit:
    name: Django tests (excluding integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run python backend/manage.py check
      - run: uv run python backend/manage.py test --exclude-tag=integration

  django-integration:
    name: Django and PostgreSQL API integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: weekly_growth_journal
          POSTGRES_USER: weekly_growth_journal
          POSTGRES_PASSWORD: weekly-growth-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weekly_growth_journal -d weekly_growth_journal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: development
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-secret
      TOKEN_SIGNING_KEY: ci-only-token-key
      DJANGO_ALLOWED_HOSTS: localhost,testserver
      POSTGRES_DB: weekly_growth_journal
      POSTGRES_USER: weekly_growth_journal
      POSTGRES_PASSWORD: weekly-growth-ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      AI_PROVIDER_MODE: fake
      AI_API_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run python backend/manage.py test --tag=integration

  frontend:
    name: Frontend tests, lint, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build

  containers:
    name: Compose configuration and image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker compose config -q
      - run: docker compose build

  security-audit:
    name: Dependency and tracked-content audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: uv sync --locked --all-extras
      - name: Scan Python dependencies
        run: uv run --with pip-audit pip-audit --format json > pip-audit.json
      - name: Scan frontend dependencies
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun audit --json > ../bun-audit.json
      - name: Check tracked content for likely secrets
        run: python agent-hooks/check_staged_changes.py --tracked
      - name: Upload dependency scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit-${{ github.run_id }}
          path: |
            pip-audit.json
            bun-audit.json
          if-no-files-found: warn
