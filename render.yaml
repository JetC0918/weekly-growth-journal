# Render Blueprint for the full-stack hobby deployment.
services:
  - type: web
    name: weekly-growth-journal-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health/
    envVars:
      - key: PORT
        value: "10000"
      - key: APP_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: TOKEN_SIGNING_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: weekly-growth-journal-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: weekly-growth-journal-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://weekly-growth-journal-frontend.onrender.com
      - key: AI_PROVIDER_MODE
        value: openai
      - key: AI_API_KEY
        value: ""

  - type: web
    name: weekly-growth-journal-frontend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    autoDeployTrigger: checksPass
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "10000"
      - key: VITE_API_BASE_URL
        value: https://weekly-growth-journal-api.onrender.com/api

databases:
  - name: weekly-growth-journal-db
    databaseName: weekly_growth_journal
    user: weekly_growth_journal_user
    plan: free
    region: singapore
    postgresMajorVersion: "16"
