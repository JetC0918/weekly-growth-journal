[project]
name = "weekly-growth-journal"
version = "0.1.0"
description = "Weekly Growth Journal Django backend and frontend prototype"
requires-python = ">=3.11"
dependencies = [
  "Django>=5.2,<6.0",
  "django-cors-headers>=4.7,<5.0",
  "djangorestframework>=3.16,<4.0",
  "fastapi>=0.115,<1.0",
  "opentelemetry-api>=1.39,<2.0",
  "opentelemetry-exporter-otlp>=1.39,<2.0",
  "opentelemetry-instrumentation-django>=0.60b0,<1.0",
  "opentelemetry-sdk>=1.39,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1.0",
  "pytest>=9.0.3,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
